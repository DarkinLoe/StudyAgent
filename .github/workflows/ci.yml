name: CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B -ntp test

      - name: Package (skip tests, already run)
        run: ./mvnw -B -ntp -DskipTests package
