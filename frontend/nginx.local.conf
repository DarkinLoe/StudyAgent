# 本机原生 Nginx 的完整配置（Windows / Linux 通用）
#
# 用途：不通过 Docker，直接在本机装 Nginx 来托管前端并反向代理后端。
# 与 Docker 版 frontend/nginx.conf 逻辑完全一致，只有两点差别：
#   1) root 用本地绝对路径（Windows 用正斜杠）
#   2) 后端地址用 127.0.0.1:8080（容器里是服务名 app:8080）
#
# 使用方法：
#   1) 把 frontend/dist 里的内容拷到 <nginx>/html/（保持 index.html 与 assets/ 同级）
#   2) 用本文件覆盖 <nginx>/conf/nginx.conf
#   3) 检查下面的 root 路径是否与你机器一致
#   4) 启动： <nginx>/nginx.exe        （Linux: nginx）
#      重载： <nginx>/nginx.exe -s reload
#      停止： <nginx>/nginx.exe -s stop

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # ---------- 压缩 ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        # 站点目录：把 frontend/dist 的内容放这里
        root   C:/nginx/html;
        index  index.html;

        # ---------- 后端接口反向代理 ----------
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id $http_x_user_id;

            client_max_body_size 60m;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        location /actuator/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        # ---------- 静态资源缓存 ----------
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---------- SPA history 回退 ----------
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
