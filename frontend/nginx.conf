# StudyAgent 前端 Nginx 配置
# 职责：① 托管 Vue 构建产物  ② 把 /api、/actuator 反向代理到 Spring Boot
# 生产推荐：Nginx 与后端同机/同 compose 网络，前端只暴露 80 端口

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 压缩 ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 后端接口反向代理 ----------
    # 注意：proxy_pass 里直接写容器名会在 Nginx **启动时**解析域名；
    # 若那一刻 app 容器还没注册进 Docker 网络 DNS，Nginx 会启动失败并退出
    # （[emerg] host not found in upstream "app"）。
    # 这里用「变量 + resolver」把解析推迟到请求时，属于 compose 部署的标准写法。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_app http://app:8080;
        # 使用变量后 Nginx 不会自动拼接 URI，需显式带上 $request_uri
        proxy_pass $backend_app$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 透传前端的用户标识（登录体系上线后换成 Authorization）
        proxy_set_header X-User-Id $http_x_user_id;

        # 文档上传：与后端 multipart 上限保持一致
        client_max_body_size 60m;

        # LLM 调用可能较慢
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /actuator/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_app http://app:8080;
        proxy_pass $backend_app$request_uri;
        proxy_set_header Host $host;
    }

    # ---------- 静态资源缓存 ----------
    # Vite 产物文件名带 hash，可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA history 路由回退 ----------
    # 直接访问 /qa、/plan 等前端路由时，交给 index.html 由 vue-router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
