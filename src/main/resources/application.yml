server:
  port: ${SERVER_PORT:8080}
  # 并发相关：Tomcat 工作线程与排队容量（LLM 调用是慢请求，需足够的线程承接）
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
    max-connections: 8192

spring:
  application:
    name: StudyAgent

  # ---------------- MySQL ----------------
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:study_agent}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      # 连接池：按"DB 连接数 = 服务实例数 × max-pool-size"估算，避免打爆 MySQL
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 2000
      max-lifetime: 1800000
      keepalive-time: 300000

  # ---------------- JPA ----------------
  jpa:
    hibernate:
      # 表结构由 Flyway 管理，Hibernate 不再改库；
      # 想额外校验实体与库是否一致，可改成 validate（首次上线建议先 none，确认无误后再开 validate）
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # 批量写入：批量插入/更新时减少往返（结合 rewriteBatchedStatements=true 生效）
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  # ---------------- Flyway 数据库迁移 ----------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有数据的老库（没有 flyway_schema_history 表）自动基线到 V1，再执行 V2+；
    # 全新空库则从 V1 开始完整建表
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  # ---------------- Redis ----------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      repositories:
        # 我们用 Redis 做缓存（RedisCacheHelper），不使用 Spring Data Redis Repository，
        # 关闭其扫描可避免启动日志里“Could not safely identify store assignment”刷屏
        enabled: false

  # ---------------- RabbitMQ ----------------
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 发布确认/无法路由回调：消息没被 Broker 确认或找不到队列时能立刻在日志里看到
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 默认不自动启动消费者：未启用 MQ 时应用可无 RabbitMQ 独立运行
        auto-startup: ${STUDY_AGENT_MQ_ENABLED:false}
        # 重试耗尽后拒绝消息（转死信），而不是无限 requeue 把消费者打死
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
          max-interval: 20s

  # ---------------- Spring AI：OpenAI 兼容端点 ----------------
  ai:
    openai:
      # 换成任意 OpenAI 兼容网关即可，例如：
      #   DeepSeek   -> https://api.deepseek.com   （chat: deepseek-chat）
      #   SiliconFlow-> https://api.siliconflow.cn/v1 （chat: Qwen/Qwen2.5-7B-Instruct, embedding: BAAI/bge-m3）
      base-url: ${AI_BASE_URL:https://api.openai.com/v1}
      api-key: ${AI_API_KEY:sk-not-configured}
      chat:
        # 注意：Spring AI 2.0 生效的是扁平属性 chat.model；
        # 同时保留 options.model 兼容 1.x 写法（两处取值相同，避免版本差异导致配置失效）
        model: ${AI_CHAT_MODEL:gpt-4o-mini}
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.7
      embedding:
        model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}

  # ---------------- 文件上传 ----------------
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ---------------- 日志 ----------------
# appender 与滚动策略见 src/main/resources/logback-spring.xml；
# 这里只控制级别；文件目录用环境变量 LOG_DIR 指定（容器内建议 /app/logs）
logging:
  level:
    root: INFO
    studio.lingrui.studyagent: ${LOG_LEVEL:INFO}

# ---------------- 业务自定义配置 ----------------
study-agent:
  user:
    # 保留字段：早期 X-User-Id 方案使用，现由 JWT 认证取代
    default-user-id: 1
  security:
    # JWT 签名密钥（HS256，>=32 字节）。生产务必用环境变量 JWT_SECRET 注入；
    # 未配置时启动生成临时随机密钥（重启后旧 token 失效，仅适合本地开发）
    jwt-secret: ${JWT_SECRET:}
    # token 有效期（分钟）
    token-ttl-minutes: ${JWT_TTL_MINUTES:720}
    # 定时任务使用 Redis 分布式锁（多实例部署防重复执行）
    distributed-job-lock: true
  rate-limit:
    enabled: true
    # 每用户每分钟：对话 / 上传
    chat-per-minute: 20
    upload-per-minute: 10
    # 每 IP 每分钟：登录尝试（防爆破）
    login-per-minute: 10
  file:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
    allowed-extensions: ppt,pptx,doc,docx,pdf,txt,md,xlsx,xls,csv
    # 单个文件大小上限（MB）：与 spring.servlet.multipart.max-file-size 保持一致并再兜一层
    max-file-size-mb: 50
  rag:
    chunk-size: 800
    chunk-overlap: 100
    top-k: 4
    min-score: 0.0
    # 启动时用已保存的解析文本重建进程内向量索引（重启后 RAG 仍可用）；文档很多时可关闭
    reindex-on-startup: true
  mq:
    # 关闭时文档摄入走同步线程，提醒只落库不入队；开启后走 RabbitMQ 异步
    enabled: ${STUDY_AGENT_MQ_ENABLED:false}
    ingest-queue: study-agent.document.ingest
    reminder-queue: study-agent.reminder.push
  reminder:
    # 学习提示轮询：每分钟扫描“到达开始时间且未完成未提醒”的计划任务
    poll-cron: "0 * * * * *"
  cache:
    default-ttl: 10m
  # Flyway 迁移自愈：启动时先 repair（清理失败迁移记录、对齐校验和）再 migrate，
  # 这样"曾经失败的迁移 + 被修正过的脚本"能自动收敛，不必手工进库删记录
  flyway:
    repair-on-startup: true
