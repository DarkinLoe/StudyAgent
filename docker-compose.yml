name: study-agent

# 学习 Agent 本地开发依赖：MySQL 8 + Redis 7 + RabbitMQ 4(带管理台)
# 用法：docker compose up -d
# 环境变量可用 .env 覆盖（参见 README）

services:
  mysql:
    image: mysql:8.4
    container_name: study-agent-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study_agent}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: study-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: study-agent-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"      # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # 管理台 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------- 应用本体（可选 profile） ----------------
  # 用法：docker compose --profile app up -d --build
  # 不启用 profile 时只起中间件，应用仍可用 mvn spring-boot:run 在宿主机运行
  app:
    profiles: ["app"]
    build:
      context: .
    container_name: study-agent-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study_agent}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      STUDY_AGENT_MQ_ENABLED: ${STUDY_AGENT_MQ_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-sk-not-configured}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      # 直接用 Spring Boot 环境变量覆盖 Spring AI 配置（relaxed binding）：
      # 好处是改模型/密钥不必重新构建镜像（application.yml 是打包进 jar 的）。
      # 同时覆盖扁平属性 chat.model 与嵌套写法 chat.options.model，避免版本差异导致静默失效。
      SPRING_AI_OPENAI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      SPRING_AI_OPENAI_API_KEY: ${AI_API_KEY:-sk-not-configured}
      SPRING_AI_OPENAI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      SPRING_AI_OPENAI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
      # 外部化配置：优先级高于 jar 内 application.yml，改模型/密钥无需重新构建镜像
      - ./docker/app-config/application.yml:/app/config/application.yml:ro

  # ---------------- 前端（Vue3 + Vite 构建，Nginx 托管并反代后端） ----------------
  # 用法：docker compose --profile app up -d --build
  # 访问：http://localhost:8081/（Nginx 内部把 /api、/actuator 反代到 app:8080）
  web:
    profiles: ["app"]
    build:
      context: ./frontend
    container_name: study-agent-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  app-data:
