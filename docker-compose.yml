name: study-agent

# 瀛︿範 Agent 鏈湴寮€鍙戜緷璧栵細MySQL 8 + Redis 7 + RabbitMQ 4(甯︾鐞嗗彴)
# 鐢ㄦ硶锛歞ocker compose up -d
# 鐜鍙橀噺鍙敤 .env 瑕嗙洊锛堝弬瑙?README锛?

services:
  mysql:
    image: mysql:8.4
    container_name: study-agent-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study_agent}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: study-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: study-agent-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"      # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # 绠＄悊鍙?http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------- 搴旂敤鏈綋锛堝彲閫?profile锛?----------------
  # 鐢ㄦ硶锛歞ocker compose --profile app up -d --build
  # 涓嶅惎鐢?profile 鏃跺彧璧蜂腑闂翠欢锛屽簲鐢ㄤ粛鍙敤 mvn spring-boot:run 鍦ㄥ涓绘満杩愯
  app:
    profiles: ["app"]
    build:
      context: .
    container_name: study-agent-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study_agent}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      STUDY_AGENT_MQ_ENABLED: ${STUDY_AGENT_MQ_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_API_KEY: ${AI_API_KEY:-sk-not-configured}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      # 鐩存帴鐢?Spring Boot 鐜鍙橀噺瑕嗙洊 Spring AI 閰嶇疆锛坮elaxed binding锛夛細
      # 濂藉鏄敼妯″瀷/瀵嗛挜涓嶅繀閲嶆柊鏋勫缓闀滃儚锛坅pplication.yml 鏄墦鍖呰繘 jar 鐨勶級銆?
      # 鍚屾椂瑕嗙洊鎵佸钩灞炴€?chat.model 涓庡祵濂楀啓娉?chat.options.model锛岄伩鍏嶇増鏈樊寮傚鑷撮潤榛樺け鏁堛€?
      SPRING_AI_OPENAI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      SPRING_AI_OPENAI_API_KEY: ${AI_API_KEY:-sk-not-configured}
      SPRING_AI_OPENAI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      SPRING_AI_OPENAI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      UPLOAD_DIR: /app/data/uploads
      # 鏃ュ織鐩綍涓庣骇鍒紙logback-spring.xml 璇诲彇锛夛紱鏃ュ織鎸佷箙鍖栧埌 app-logs 鍗?
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      # 澶栭儴鍖栭厤缃細浼樺厛绾ч珮浜?jar 鍐?application.yml锛屾敼妯″瀷/瀵嗛挜鏃犻渶閲嶆柊鏋勫缓闀滃儚
      - ./docker/app-config/application.yml:/app/config/application.yml:ro

  # ---------------- 鍓嶇锛圴ue3 + Vite 鏋勫缓锛孨ginx 鎵樼骞跺弽浠ｅ悗绔級 ----------------
  # 鐢ㄦ硶锛歞ocker compose --profile app up -d --build
  # 璁块棶锛歨ttp://localhost:8081/锛圢ginx 鍐呴儴鎶?/api銆?actuator 鍙嶄唬鍒?app:8080锛?
  web:
    profiles: ["app"]
    build:
      context: ./frontend
    container_name: study-agent-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  app-data:
  app-logs: